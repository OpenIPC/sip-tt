[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[1001]
type=endpoint
context=default
disallow=all
allow=ulaw,alaw,h264,h265
auth=1001auth
aors=1001
direct_media=no
rtp_symmetric=yes
force_rport=yes
[1001auth]
type=auth
auth_type=userpass
username=1001
password=camera123
[1001]
type=aor
max_contacts=2
remove_existing=yes

[123]
type=endpoint
context=default
disallow=all
allow=ulaw,alaw,h264,h265
auth=123auth
aors=123
direct_media=no
rtp_symmetric=yes
force_rport=yes
[123auth]
type=auth
auth_type=userpass
username=123
password=pc123
[123]
type=aor
max_contacts=2
remove_existing=yes
contact=sip:123@192.0.2.1:5070   ; a softphone, if you use one

[223]
type=endpoint
context=default
disallow=all
allow=ulaw,alaw,h264,h265
auth=223auth
aors=223
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
[223auth]
type=auth
