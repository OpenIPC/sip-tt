name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  unit:
    name: unit (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: pip install -e .
      - name: Tests
        run: pytest tests/ -v
      - name: Wheel packaging check
        # `pip install -e .` cannot catch a package-data glob that misses, and
        # a wheel without the catalogue installs fine and then lists nothing.
        shell: python
        run: |
          import subprocess, sys, zipfile, glob, pathlib
          subprocess.run([sys.executable, "-m", "pip", "wheel", "--no-deps",
                          "-w", "/tmp/wh", "."], check=True)
          whl = glob.glob("/tmp/wh/sip_tt-*.whl")
          assert whl, "no wheel built"
          names = zipfile.ZipFile(whl[0]).namelist()
          assert any(n.endswith("sip_tt/catalog.json") for n in names), \
              f"catalog.json missing from the wheel: {names[:20]}"
          print(f"wheel ok: {len(names)} entries")

  integration:
    name: integration (baresip DUT)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Install and start the device under test
        # baresip is a real SIP user agent — it negotiates properly and sends
        # real RTP — and it is built for headless operation, so it needs no
        # sound card, display or X server. See ci/dut/baresip-dut.sh for why
        # it is baresip and not linphonec.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq baresip
          sudo mkdir -p /root/.baresip
          sudo -E SIP_PORT=5080 HOME=/root ci/dut/baresip-dut.sh
          sudo tail -5 /tmp/baresip.log

      - name: Wait for the DUT to answer
        run: |
          python3 ci/dut/ping-dut.py 127.0.0.1 5080 30 || {
            echo "--- baresip log ---"; sudo cat /tmp/baresip.log; exit 1; }

      - name: Run the suite
        run: |
          # --skip-tag advisory leaves out the purposes that measure a
          # SHOULD; they are reported for information and gating a build on
          # them is noise. The run names what it left out rather than
          # dropping it silently.
          sip-tt run --target 127.0.0.1:5080 --user dut \
                    --local-ip 127.0.0.1 --local-port 5064 \
                    --roles terminating --with-media --skip-tag advisory \
                    --junit-xml junit.xml --json-report results.json

      - name: Summarise
        if: always()
        run: |
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path("results.json")
          if not p.exists():
              print("no results.json — the run did not get far enough")
              raise SystemExit(0)
          d = json.loads(p.read_text())
          print(json.dumps(d["summary"], indent=2))
          for r in sorted(d["results"], key=lambda r: r["id"]):
              if r["status"] in ("failed", "skipped"):
                  print(f"{r['status']:8s} {r['id']}: {r.get('message','')[:200]}")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-results
          path: |
            junit.xml
            results.json
            /tmp/baresip.log
          if-no-files-found: warn
